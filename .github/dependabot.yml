version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The @angular/* framework is pinned at 4.1.3 in lockstep with rxjs@5.4.0.
  # Bumping @angular/core alone to >=6 requires rxjs@6 (rxjs/operators) and breaks the
  # unit-test bootstrap. The newer Angular CVEs Dependabot reports target features that
  # do not exist in 4.1.3 ($localize i18n, client hydration) or paths we do not use
  # (Angular's template sanitizer; untrusted HTML uses sanitize-html). See SECURITY.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - "version-update:semver-major"

