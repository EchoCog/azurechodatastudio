name: Zone-Cog Bridge Extension

on:
  push:
    branches:
      - main
    tags:
      - 'zonecog-bridge-v*.*.*'
    paths:
      - 'extensions/zonecog-bridge/**'
      - '.github/workflows/zonecog-bridge.yml'
      - 'docs/ZONECOG_BRIDGE_PUBLISHING.md'
  pull_request:
    paths:
      - 'extensions/zonecog-bridge/**'
      - '.github/workflows/zonecog-bridge.yml'
      - 'docs/ZONECOG_BRIDGE_PUBLISHING.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/zonecog-bridge

jobs:
  build-and-package:
    name: 'Build, test, and validate packaging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: 'Install dependencies'
        run: yarn install --frozen-lockfile

      - name: 'Compile'
        run: yarn compile

      - name: 'Test'
        run: yarn test

      - name: 'Validate marketplace readiness'
        run: yarn validate:marketplace

      - name: 'Pre-publish validation (vsce package dry-run)'
        run: yarn package:dry-run

  release-and-publish:
    name: 'Release VSIX and publish'
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/zonecog-bridge-v')
    runs-on: ubuntu-latest
    environment: zonecog-bridge-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: 'Install dependencies'
        run: yarn install --frozen-lockfile

      - name: 'Compile'
        run: yarn compile

      - name: 'Read extension version'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#zonecog-bridge-v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) must match package.json version ($VERSION)"
            exit 1
          fi

      - name: 'Validate marketplace readiness'
        run: yarn validate:marketplace

      - name: 'Pre-publish validation (vsce package dry-run)'
        run: yarn package:dry-run

      - name: 'Package VSIX'
        run: yarn package

      - name: 'Upload VSIX artifact'
        uses: actions/upload-artifact@v4
        with:
          name: zonecog-bridge-${{ steps.version.outputs.version }}
          path: extensions/zonecog-bridge/*.vsix
          if-no-files-found: error
          retention-days: 30

      - name: 'Create GitHub Release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VSIX=$(ls zonecog-bridge-*.vsix | head -n 1)
          NOTES_FILE=$(mktemp)
          {
            echo "## Zone-Cog Cognitive Bridge ${VERSION}"
            echo
            echo "Marketplace extension ID: \`EchoCog.zonecog-bridge\`"
            echo
            echo "### Install from VSIX"
            echo '```bash'
            echo "code --install-extension ${VSIX}"
            echo '```'
            echo
            echo "### Publish targets"
            echo "- Visual Studio Marketplace (when \`VSCE_PAT\` is configured)"
            echo "- Open VSX (when \`OVSX_PAT\` is configured)"
            echo
            echo "See \`docs/ZONECOG_BRIDGE_PUBLISHING.md\` for publisher setup and release process."
          } > "$NOTES_FILE"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Zone-Cog Bridge ${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "Zone-Cog Bridge ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

      - name: 'Publish to VS Code Marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo '::warning::VSCE_PAT is not configured on the zonecog-bridge-publish environment; skipping Marketplace publish.'
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"

      - name: 'Publish to Open VSX'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo '::warning::OVSX_PAT is not configured on the zonecog-bridge-publish environment; skipping Open VSX publish.'
            exit 0
          fi
          VSIX=$(ls zonecog-bridge-*.vsix | head -n 1)
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT"

      - name: 'Publish status summary'
        if: always()
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          if [ -n "${VSCE_PAT}" ]; then echo "Marketplace PAT: configured"; else echo "Marketplace PAT: missing"; fi
          if [ -n "${OVSX_PAT}" ]; then echo "Open VSX PAT: configured"; else echo "Open VSX PAT: missing"; fi
          ls -la *.vsix || true
